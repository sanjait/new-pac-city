name: Source reachability probe (temporary)

# Diagnostic only. Fetches candidate feeds from GitHub's runners to find out
# which ones block datacenter IPs — the failure mode that took the
# Spokesman-Review feeds offline while they still worked from a laptop.
# Read-only: touches no site files, commits nothing. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch every candidate feed with the production User-Agent
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.error, time
          UA = "NewPACCityBot/0.1 (news aggregator; links and attribution only)"
          SRCS = json.loads(r'''[{"u": "https://pac-12.com/rss.aspx","n": "Pac-12 Conference","o": "production"},{"u": "https://broncosports.com/rss?path=football","n": "Boise State Athletics","o": "production"},{"u": "https://broncosports.com/rss?path=mbball","n": "Boise State Athletics","o": "production"},{"u": "https://broncosports.com/rss?path=wbball","n": "Boise State Athletics","o": "production"},{"u": "https://csurams.com/rss?path=football","n": "Colorado State Athletics","o": "production"},{"u": "https://csurams.com/rss?path=mbball","n": "Colorado State Athletics","o": "production"},{"u": "https://csurams.com/rss?path=wbball","n": "Colorado State Athletics","o": "production"},{"u": "https://gobulldogs.com/rss?path=football","n": "Fresno State Athletics","o": "production"},{"u": "https://gobulldogs.com/rss?path=mbball","n": "Fresno State Athletics","o": "production"},{"u": "https://gobulldogs.com/rss?path=wbball","n": "Fresno State Athletics","o": "production"},{"u": "https://gozags.com/rss?path=mbball","n": "Gonzaga Athletics","o": "production"},{"u": "https://gozags.com/rss?path=wbball","n": "Gonzaga Athletics","o": "production"},{"u": "https://www.spokesman.com/feeds/stories/gonzaga-basketball/","n": "The Spokesman-Review","o": "production"},{"u": "https://osubeavers.com/rss?path=football","n": "Oregon State Athletics","o": "production"},{"u": "https://osubeavers.com/rss?path=mbball","n": "Oregon State Athletics","o": "production"},{"u": "https://osubeavers.com/rss?path=wbball","n": "Oregon State Athletics","o": "production"},{"u": "https://www.oregonlive.com/arc/outboundfeeds/rss/category/beavers/?outputType=xml","n": "The Oregonian","o": "production"},{"u": "https://goaztecs.com/sports/football/rss","n": "San Diego State Athletics","o": "production"},{"u": "https://goaztecs.com/sports/mens-basketball/rss","n": "San Diego State Athletics","o": "production"},{"u": "https://goaztecs.com/sports/womens-basketball/rss","n": "San Diego State Athletics","o": "production"},{"u": "https://txst.com/rss.aspx?path=football","n": "Texas State Athletics","o": "production"},{"u": "https://txst.com/rss.aspx?path=mbball","n": "Texas State Athletics","o": "production"},{"u": "https://txst.com/rss.aspx?path=wbball","n": "Texas State Athletics","o": "production"},{"u": "https://utahstateaggies.com/rss.aspx?path=football","n": "Utah State Athletics","o": "production"},{"u": "https://utahstateaggies.com/rss.aspx?path=mbball","n": "Utah State Athletics","o": "production"},{"u": "https://utahstateaggies.com/rss.aspx?path=wbball","n": "Utah State Athletics","o": "production"},{"u": "https://wsucougars.com/sports/football/rss","n": "Washington State Athletics","o": "production"},{"u": "https://wsucougars.com/sports/mens-basketball/rss","n": "Washington State Athletics","o": "production"},{"u": "https://wsucougars.com/sports/womens-basketball/rss","n": "Washington State Athletics","o": "production"},{"u": "https://www.spokesman.com/feeds/stories/wsu-football/","n": "The Spokesman-Review","o": "production"},{"u": "https://www.spokesman.com/feeds/stories/wsu-basketball/","n": "The Spokesman-Review","o": "production"},{"u": "https://www.spokesman.com/feeds/stories/gonzaga-womens-basketball/","n": "The Spokesman-Review","o": "production"},{"u": "https://firstkickwasgood.com/feed/","n": "First Kick Was Good","o": "round2"},{"u": "https://arbiteronline.com/feed/","n": "The Arbiter","o": "round2"},{"u": "https://collegian.com/feed/","n": "Rocky Mountain Collegian","o": "round2"},{"u": "https://thedailyaztec.com/category/sports/feed/","n": "The Daily Aztec","o": "round2"},{"u": "https://universitystar.com/category/sports/feed/","n": "The University Star","o": "round2"},{"u": "https://usustatesman.com/feed/","n": "The Utah Statesman","o": "round2"},{"u": "https://www.hjnews.com/search/?f=rss&t=article&c=sports/usu&l=25&s=start_time&sd=desc","n": "Herald Journal","o": "round2"},{"u": "https://www.cougcenter.com/rss/index.xml","n": "CougCenter","o": "round2"},{"u": "https://www.mwcconnection.com/rss/index.xml","n": "Mountain West Connection","o": "round2"},{"u": "https://www.slipperstillfits.com/rss/index.xml","n": "The Slipper Still Fits","o": "round2"},{"u": "https://www.underdogdynasty.com/rss/index.xml","n": "Underdog Dynasty","o": "round2"},{"u": "https://rss.art19.com/the-bronco-sports-podcast-network","n": "Bronco Sports Podcast Network","o": "round2"},{"u": "https://sonsofmontezuma.libsyn.com/rss","n": "Sons of Montezuma","o": "round2"},{"u": "https://rss.pdrl.fm/7c57f3/feeds.simplecast.com/YWiGyRFm","n": "Locked On Zags","o": "round2"},{"u": "https://feeds.simplecast.com/g9sUytnS","n": "DNVR CSU Rams Podcast","o": "round2"},{"u": "https://feed.podbean.com/redwavereport/feed.xml","n": "The Red Wave Report","o": "round2"},{"u": "https://anchor.fm/s/109676fec/podcast/rss","n": "Palouse Playbook","o": "round2"},{"u": "https://feeds.fastcast.ai/washington-state-cougars-football-today-2-min-news.xml","n": "WSU Football Today | 2 Min News","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCw7-Uy9ACDofmfVbbZtu-1Q","n": "Boise State Athletics","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCjo6qGSNLTH50heHy4dZvrw","n": "Colorado State Rams","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCcLLepYprPuttYSaE6HmIqQ","n": "Fresno State Athletics","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCtgmGRoEuaT474XkV0444_g","n": "Gonzaga Bulldogs","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCQqGqTQ18H0o7rbAy8_XGFA","n": "Our Beaver Nation","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCZB5DwBy4rb4T6zyx19oFVw","n": "SDSU Athletics","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCOPkV4JIOGfVXHmkWT0-SOA","n": "Texas State Bobcat Athletics","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCku3Gl14lUgxTVao-iFtRdw","n": "Utah State Athletics","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCwL51tUez4x2TSb_gfAyLfw","n": "WSU Cougar Athletics","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCtxdtF8iCxZw593FSUIPrxg","n": "Pac-12","o": "round2"},{"u": "https://www.youtube.com/feeds/videos.xml?channel_id=UCFzm4DYdmJrPAUh7qb85CPQ","n": "Locked On Zags","o": "round2"},{"u": "https://bsky.app/profile/pac12.bsky.social/rss","n": "Pac-12 Conference","o": "round2"},{"u": "https://bsky.app/profile/coltonbmc.bsky.social/rss","n": "Colton McWilliams (San Marcos Daily Record sports editor)","o": "round2"},{"u": "https://bsky.app/profile/bagleysports.bsky.social/rss","n": "Matt Bagley (SI.com Oregon State)","o": "round2"},{"u": "https://bsky.app/profile/mwcconnection.bsky.social/rss","n": "Mountain West Connection","o": "round2"}]''')
          results = []
          for s in SRCS:
              try:
                  req = urllib.request.Request(s["u"], headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read()
                  server = r.headers.get("Server", "")
                  results.append((s["o"], "OK", r.status, len(body), server, s["n"], s["u"]))
              except urllib.error.HTTPError as e:
                  results.append((s["o"], "HTTP", e.code, 0, e.headers.get("Server",""), s["n"], s["u"]))
              except Exception as e:
                  results.append((s["o"], "ERR", type(e).__name__, 0, "", s["n"], s["u"]))
              time.sleep(0.3)
          print("=== PROBE RESULTS (origin | outcome | code | bytes | server | source | url) ===")
          for r in results:
              print(" | ".join(str(x) for x in r))
          ok = sum(1 for r in results if r[1] == "OK")
          print(f"=== SUMMARY: {ok}/{len(results)} reachable from GitHub runners ===")
          for r in results:
              if r[1] != "OK":
                  print(f"BLOCKED: {r[5]} -> {r[2]} ({r[6]})")
          EOF
