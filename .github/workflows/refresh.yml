name: Refresh news

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the page from live feeds
        run: python3 build.py

      - name: Publish if anything changed
        run: |
          git config user.name "newpac-city-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No news changes this cycle."
          else
            git commit -m "Auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
